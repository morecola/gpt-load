name: Release (fork)

# fork 专用发布流程：产出 GitHub Release、各平台二进制，并构建多架构镜像推送到
# ghcr.io（用自带的 GITHUB_TOKEN，无需任何额外 secrets）。不推送 DockerHub。
# 上游的 release.yml 受 internal/webui 契约测试保护，且发布链路硬依赖 DockerHub
# secrets（publish-github 需要 publish-images 成功，后者必须登录 DockerHub），
# 在 fork 中保持该文件原样并禁用其触发，tag 发版统一走本工作流。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node for web build
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            output="dist/gpt-load-${goos}-${goarch}"
            if [[ "${goos}" == "windows" ]]; then
              output="${output}.exe"
            fi
            echo "building ${output}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath \
              -ldflags "-s -w -X gpt-load/internal/platform/version.Version=${GITHUB_REF_NAME}" \
              -o "${output}" .
          done
          cd dist
          sha256sum gpt-load-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flags=(--title "${GITHUB_REF_NAME}" --generate-notes)
          # 带 prerelease 后缀（如 v2.0.0-cola.1）的 tag 标记为预发布。
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" dist/*

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # ghcr 镜像名必须全小写。
          image="ghcr.io/$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')/gpt-load"
          version="${GITHUB_REF_NAME#v}"
          tags="${image}:${version}"
          # 预发布版本不移动 :latest。
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          {
            printf 'version=%s\n' "${version}"
            printf 'tags<<EOF\n%s\nEOF\n' "${tags}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
