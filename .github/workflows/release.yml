name: Release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      image_exact: ${{ steps.tag.outputs.image_exact }}
      image_beta: ${{ steps.tag.outputs.image_beta }}
      image_major: ${{ steps.tag.outputs.image_major }}
      release_kind: ${{ steps.tag.outputs.release_kind }}
      channel_beta: ${{ steps.tag.outputs.channel_beta }}
      promote_major: ${{ steps.tag.outputs.promote_major }}
      ci_verified: ${{ steps.ci.outputs.ci_verified }}

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate strict 2.x SemVer tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          semver_regex='^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ ! "${tag}" =~ ${semver_regex} ]]; then
            printf 'invalid 2.x release tag\n' >&2
            exit 1
          fi

          version="${tag#v}"
          core="${version%%-*}"

          prerelease=false
          release_kind=stable
          channel_beta=false
          promote_major=true

          if [[ "${version}" == *-* ]]; then
            prerelease=true
            prerelease_value="${version#*-}"
            release_kind=other
            promote_major=false

            IFS='.' read -r -a identifiers <<<"${prerelease_value}"

            for identifier in "${identifiers[@]}"; do
              if [[ "${identifier}" =~ ^[0-9]+$ ]] &&
                [[ "${identifier}" != "0" ]] &&
                [[ "${identifier}" == 0* ]]; then
                printf 'numeric prerelease identifiers cannot contain leading zeroes\n' >&2
                exit 1
              fi
            done
          fi

          channel_beta_regex='^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$'

          if [[ "${tag}" =~ ${channel_beta_regex} ]]; then
            channel_beta=true
            release_kind=beta
          elif [[ "${tag}" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
            release_kind=rc
          fi

          IFS='.' read -r major minor _ <<<"${core}"

          image_beta=

          if [[ "${channel_beta}" == "true" ]]; then
            image_beta="${major}.${minor}-beta"
          fi

          # 2.0.0 的 beta / rc 允许提前推进 :2。
          # 后续普通 prerelease 不推进 major channel。
          if [[ "${core}" == "2.0.0" ]] &&
            [[ "${release_kind}" == "beta" || "${release_kind}" == "rc" ]]; then
            promote_major=true
          fi

          {
            printf 'version=%s\n' "${tag}"
            printf 'prerelease=%s\n' "${prerelease}"
            printf 'image_exact=%s\n' "${version}"
            printf 'image_beta=%s\n' "${image_beta}"
            printf 'image_major=%s\n' "${major}"
            printf 'release_kind=%s\n' "${release_kind}"
            printf 'channel_beta=%s\n' "${channel_beta}"
            printf 'promote_major=%s\n' "${promote_major}"
          } >>"${GITHUB_OUTPUT}"

      - name: Require tag commit in main history
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Reuse CI verdict for this commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          runs=query-failed
          ci_verified=false

          if runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[
                .workflow_runs[]
                | select(.status == "completed" and .conclusion == "success")
              ] | length'
          )" &&
            [[ "${runs}" =~ ^[0-9]+$ ]] &&
            ((runs > 0)); then
            ci_verified=true
          fi

          printf 'ci_verified=%s\n' "${ci_verified}" >>"${GITHUB_OUTPUT}"

          printf 'successful ci.yml runs for %s: %s -> ci_verified=%s\n' \
            "${GITHUB_SHA}" \
            "${runs}" \
            "${ci_verified}"

  verify-and-build-web:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build web UI
        uses: ./.github/actions/web-ci

      - name: Upload verified web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-web-dist
          path: internal/webui/dist
          if-no-files-found: error
          retention-days: 1

  static-checks:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail

          formatted_files="$(gofmt -l .)"
          test -z "${formatted_files}"

      - name: Check module graph
        run: go mod tidy -diff

      - name: Check embedded CPA bridge module
        working-directory: third_party/cpaembedded
        run: |
          go mod tidy -diff
          go vet ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build -trimpath -o gpt-load .

      - name: Check repository invariants
        run: git diff --check

  race-tests:
    needs: validate-tag
    if: ${{ needs.validate-tag.outputs.ci_verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark race-instrumented Go cache scope
        run: echo race-tests > .go-cache-scope

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .go-cache-scope

      - name: Run race-enabled tests
        run: go test -race -count=1 -timeout=15m . ./internal/...

  race-cpa:
    needs: validate-tag
    if: ${{ needs.validate-tag.outputs.ci_verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: third_party/cpaembedded/go.sum

      - name: Run embedded CPA bridge race-enabled tests
        working-directory: third_party/cpaembedded
        run: go test -race -count=1 -timeout=15m ./...

  database-contract:
    name: Database contract (${{ matrix.driver }})
    needs: validate-tag
    if: ${{ needs.validate-tag.outputs.ci_verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - driver: mysql
            dsn: mysql://root:root@127.0.0.1:3306/gpt_load?charset=utf8mb4&transaction_isolation=%27READ-COMMITTED%27

          - driver: postgres
            dsn: postgres://postgres:postgres@127.0.0.1:5432/gpt_load?sslmode=disable

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gpt_load
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20

      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpt_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gpt_load"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run external database contract
        env:
          GPT_LOAD_DATABASE_TEST_DSN: ${{ matrix.dsn }}
        run: |
          go test \
            -v \
            -count=1 \
            ./internal/storage \
            ./internal/control \
            ./internal/requestlog \
            -run '^TestExternal'

  build-binaries:
    needs: verify-and-build-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: gpt-load-linux-amd64

          - goos: linux
            goarch: arm64
            filename: gpt-load-linux-arm64

          - goos: darwin
            goarch: amd64
            filename: gpt-load-macos-amd64

          - goos: darwin
            goarch: arm64
            filename: gpt-load-macos-arm64

          - goos: windows
            goarch: amd64
            filename: gpt-load-windows-amd64.exe

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-web-dist
          path: internal/webui/dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          go build \
            -trimpath \
            -ldflags "-s -w -X gpt-load/internal/platform/version.Version=${{ github.ref_name }}" \
            -o "release/${{ matrix.filename }}" \
            .

      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.filename }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14

  build-windows-setup:
    needs: build-binaries
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-windows-amd64.exe
          path: release

      - name: Build Windows setup
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler is unavailable: $compiler"
          }

          & $compiler `
            "/DAppVersion=$env:RELEASE_VERSION" `
            "packaging/windows/gpt-load.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path "release/gpt-load-windows-setup.exe")) {
            throw "Windows setup was not generated"
          }

      - name: Upload Windows setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-gpt-load-windows-setup.exe
          path: release/gpt-load-windows-setup.exe
          if-no-files-found: error
          retention-days: 14

  package-metadata:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate release SBOM and license assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp LICENSE release/LICENSE
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          cp LICENSES/Apache-2.0.txt release/Apache-2.0.txt
          cp LICENSES/Inno-Setup.txt release/Inno-Setup.txt
          cp LICENSES/MIT.txt release/MIT.txt
          cp LICENSES/MPL-2.0.txt release/MPL-2.0.txt

          go run \
            github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            mod \
            -json \
            -noserial \
            -notimestamp \
            -output release/bom.cdx.json \
            .

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release
          if-no-files-found: error
          retention-days: 1

  package-checksums:
    needs:
      - build-binaries
      - build-windows-setup
      - package-metadata

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-gpt-load-*
          path: release
          merge-multiple: true

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          grep -vFx 'SHA256SUMS' \
            .github/release-assets.txt \
            >/tmp/checksum-targets

          cd release

          xargs \
            -a /tmp/checksum-targets \
            -d '\n' \
            sha256sum \
            >SHA256SUMS

      - name: Verify complete release asset set
        run: .github/scripts/release-verify-assets.sh release

      - name: Upload complete release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  native-artifact-smoke:
    needs: package-checksums
    timeout-minutes: 10

    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        include:
          - runner: ubuntu-24.04
            filename: gpt-load-linux-amd64

          - runner: ubuntu-24.04-arm
            filename: gpt-load-linux-arm64

          - runner: macos-15-intel
            filename: gpt-load-macos-amd64

          - runner: macos-15
            filename: gpt-load-macos-arm64

          - runner: windows-2025
            filename: gpt-load-windows-amd64.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.filename }}
          path: native-smoke

      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: native-smoke

      - name: Smoke POSIX native artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_BINARY: ${{ github.workspace }}/native-smoke/${{ matrix.filename }}
          RELEASE_SMOKE_CHECKSUM_FILE: ${{ github.workspace }}/native-smoke/SHA256SUMS
        run: .github/scripts/release-native-smoke.sh

      - name: Smoke Windows native artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_BINARY: ${{ github.workspace }}/native-smoke/${{ matrix.filename }}
          RELEASE_SMOKE_CHECKSUM_FILE: ${{ github.workspace }}/native-smoke/SHA256SUMS
        run: |
          & .github/scripts/release-native-smoke.ps1
          exit $LASTEXITCODE

  windows-installer-smoke:
    needs: package-checksums
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows setup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-windows-setup.exe
          path: installer-smoke

      - name: Download portable Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-windows-amd64.exe
          path: installer-smoke

      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: installer-smoke

      - name: Smoke Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_WINDOWS_SETUP: ${{ github.workspace }}\installer-smoke\gpt-load-windows-setup.exe
          RELEASE_WINDOWS_BINARY: ${{ github.workspace }}\installer-smoke\gpt-load-windows-amd64.exe
          RELEASE_SMOKE_CHECKSUM_FILE: ${{ github.workspace }}\installer-smoke\SHA256SUMS
        run: |
          & .github/scripts/release-windows-installer-smoke.ps1
          exit $LASTEXITCODE

  docker-smoke:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke local image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_SUFFIX: ${{ github.run_id }}
          RELEASE_SMOKE_TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: .github/scripts/release-docker-smoke.sh

  prebuilt-image-smoke:
    name: Prebuilt image smoke (${{ matrix.arch }})
    needs: build-binaries
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04

          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download prebuilt Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-gpt-load-linux-${{ matrix.arch }}
          path: release

      - name: Build and smoke prebuilt image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_SUFFIX: prebuilt-${{ matrix.arch }}-${{ github.run_id }}
          RELEASE_SMOKE_TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          RELEASE_SMOKE_BUILD_TARGET: prebuilt
        run: .github/scripts/release-docker-smoke.sh

  publication-preflight:
    needs:
      - validate-tag
      - verify-and-build-web
      - static-checks
      - race-tests
      - race-cpa
      - build-binaries
      - build-windows-setup
      - package-checksums
      - native-artifact-smoke
      - windows-installer-smoke
      - docker-smoke
      - prebuilt-image-smoke
      - database-contract

    # race-tests / race-cpa / database-contract 在同一 commit 的 CI
    # 已经通过时允许 skipped。
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write
      packages: read

    outputs:
      publication_state: ${{ steps.classify.outputs.publication_state }}
      write_mode: ${{ steps.classify.outputs.write_mode }}

      github_state: ${{ steps.inventory.outputs.github_state }}
      github_target_sha: ${{ steps.inventory.outputs.github_target_sha }}
      github_assets: ${{ steps.inventory.outputs.github_assets }}

      ghcr_state: ${{ steps.inventory.outputs.ghcr_state }}
      ghcr_digest: ${{ steps.inventory.outputs.ghcr_digest }}
      ghcr_revision: ${{ steps.inventory.outputs.ghcr_revision }}

      ghcr_latest_digest: ${{ steps.inventory.outputs.ghcr_latest_digest }}

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download complete release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify current-run tag and release assets
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"

          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Verify complete release asset set
        run: .github/scripts/release-verify-assets.sh release

      - name: Verify GitHub publication access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -n "${GH_TOKEN}"

          gh auth status
          gh api "repos/${GITHUB_REPOSITORY}" --silent

      - name: Log in to GHCR for read-only inventory
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inventory publication channels
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_EXACT: ${{ needs.validate-tag.outputs.image_exact }}
        run: |
          set -euo pipefail

          github_state=absent
          github_target_sha=
          github_assets=absent
          github_draft=
          github_prerelease=

          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,targetCommitish,isDraft,isPrerelease,assets \
            >/tmp/existing-release.json \
            2>/tmp/existing-release.error; then

            github_state=present

            github_target_sha="$(
              jq -r '.targetCommitish // empty' \
                /tmp/existing-release.json
            )"

            github_draft="$(
              jq -r '.isDraft' \
                /tmp/existing-release.json
            )"

            github_prerelease="$(
              jq -r '.isPrerelease' \
                /tmp/existing-release.json
            )"

            jq -r '.assets[].name' \
              /tmp/existing-release.json |
              LC_ALL=C sort \
              >/tmp/existing-release-assets

            github_assets=mismatch

            if cmp \
              .github/release-assets.txt \
              /tmp/existing-release-assets; then

              rm -rf existing-release
              mkdir existing-release

              gh release download "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --dir existing-release

              if .github/scripts/release-verify-assets.sh \
                existing-release \
                release/SHA256SUMS; then
                github_assets=match
              fi
            fi

          elif grep -Eqi \
            'HTTP 404|Not Found|release not found' \
            /tmp/existing-release.error; then

            github_state=absent

          else
            cat /tmp/existing-release.error >&2
            exit 1
          fi

          ghcr_state=absent
          ghcr_digest=absent
          ghcr_revision=

          exact_image="ghcr.io/tbphp/gpt-load:${IMAGE_EXACT}"

          ghcr_digest="$(
            .github/scripts/release-image-digest.sh \
              "${exact_image}"
          )"

          if [[ "${ghcr_digest}" != "absent" ]]; then
            ghcr_state=present

            revision_status=0

            .github/scripts/release-verify-image-revision.sh \
              "${exact_image}" \
              "${GITHUB_SHA}" \
              >/tmp/ghcr-revision \
              2>/tmp/ghcr-revision.error ||
              revision_status=$?

            case "${revision_status}" in
              0)
                ghcr_revision=match
                ;;
              1)
                ghcr_revision=mismatch
                ;;
              *)
                cat /tmp/ghcr-revision.error >&2 || true
                exit "${revision_status}"
                ;;
            esac
          fi

          ghcr_latest_digest="$(
            .github/scripts/release-image-digest.sh \
              ghcr.io/tbphp/gpt-load:latest
          )"

          {
            printf 'github_state=%s\n' "${github_state}"
            printf 'github_target_sha=%s\n' "${github_target_sha}"
            printf 'github_assets=%s\n' "${github_assets}"
            printf 'github_draft=%s\n' "${github_draft}"
            printf 'github_prerelease=%s\n' "${github_prerelease}"

            printf 'ghcr_state=%s\n' "${ghcr_state}"
            printf 'ghcr_digest=%s\n' "${ghcr_digest}"
            printf 'ghcr_revision=%s\n' "${ghcr_revision}"

            printf 'ghcr_latest_digest=%s\n' "${ghcr_latest_digest}"
          } >>"${GITHUB_OUTPUT}"

          printf '%s\n' \
            "github=${github_state}/${github_target_sha}/${github_assets}/${github_draft}/${github_prerelease}" \
            "ghcr=${ghcr_state}/${ghcr_digest}/${ghcr_revision}" \
            "ghcr_latest=${ghcr_latest_digest}"

      - name: Classify publication state
        id: classify
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}

          GITHUB_STATE: ${{ steps.inventory.outputs.github_state }}
          GITHUB_TARGET_SHA: ${{ steps.inventory.outputs.github_target_sha }}
          GITHUB_ASSETS: ${{ steps.inventory.outputs.github_assets }}
          GITHUB_DRAFT: ${{ steps.inventory.outputs.github_draft }}
          GITHUB_PRERELEASE: ${{ steps.inventory.outputs.github_prerelease }}

          GHCR_STATE: ${{ steps.inventory.outputs.ghcr_state }}
          GHCR_REVISION: ${{ steps.inventory.outputs.ghcr_revision }}
        run: |
          set -euo pipefail

          publication_state=
          write_mode=

          if [[ "${GITHUB_STATE}" == "absent" &&
            "${GHCR_STATE}" == "absent" ]]; then

            publication_state=absent
            write_mode=publish

          elif [[ "${GITHUB_STATE}" == "present" &&
            "${GHCR_STATE}" == "present" &&
            "${GITHUB_TARGET_SHA}" == "${EXPECTED_SHA}" &&
            "${GITHUB_ASSETS}" == "match" &&
            "${GITHUB_DRAFT}" == "true" &&
            "${GITHUB_PRERELEASE}" == "${EXPECTED_PRERELEASE}" &&
            "${GHCR_REVISION}" == "match" ]]; then

            publication_state=complete
            write_mode=verify

          else
            publication_state=partial-or-conflicting
            write_mode=blocked
          fi

          {
            printf 'publication_state=%s\n' "${publication_state}"
            printf 'write_mode=%s\n' "${write_mode}"
          } >>"${GITHUB_OUTPUT}"

          printf '%s\n' \
            "publication_state=${publication_state}" \
            "write_mode=${write_mode}"

      - name: Reject partial or conflicting publication
        shell: bash
        env:
          WRITE_MODE: ${{ steps.classify.outputs.write_mode }}
        run: |
          set -euo pipefail

          if [[ "${WRITE_MODE}" == "blocked" ]]; then
            printf 'existing publication is partial or conflicting\n' >&2
            exit 1
          fi

  publish-images:
    needs:
      - validate-tag
      - publication-preflight

    if: >-
      ${{
        !cancelled() &&
        needs.validate-tag.result == 'success' &&
        needs.publication-preflight.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download prebuilt Linux binaries
        if: ${{ needs.publication-preflight.outputs.write_mode == 'publish' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-gpt-load-linux-*
          path: release
          merge-multiple: true

      - name: Set up QEMU
        if: ${{ needs.publication-preflight.outputs.write_mode == 'publish' }}
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate exact image metadata
        if: ${{ needs.publication-preflight.outputs.write_mode == 'publish' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/tbphp/gpt-load

          tags: |
            type=raw,value=${{ needs.validate-tag.outputs.image_exact }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish exact multi-platform image
        if: ${{ needs.publication-preflight.outputs.write_mode == 'publish' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Verify exact published image
        shell: bash
        env:
          IMAGE_EXACT: ${{ needs.validate-tag.outputs.image_exact }}
        run: |
          set -euo pipefail

          exact_image="ghcr.io/tbphp/gpt-load:${IMAGE_EXACT}"

          .github/scripts/release-verify-image-revision.sh \
            "${exact_image}" \
            "${GITHUB_SHA}" \
            >/dev/null

          exact_digest="$(
            .github/scripts/release-image-digest.sh \
              "${exact_image}"
          )"

          test -n "${exact_digest}"
          test "${exact_digest}" != "absent"

          printf 'published exact digest: %s\n' "${exact_digest}"

  publish-github:
    needs:
      - validate-tag
      - publication-preflight
      - publish-images

    if: >-
      ${{
        !cancelled() &&
        needs.validate-tag.result == 'success' &&
        needs.publication-preflight.result == 'success' &&
        needs.publish-images.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download complete release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Verify complete release asset set
        run: .github/scripts/release-verify-assets.sh release

      - name: Verify existing GitHub Release
        if: ${{ needs.publication-preflight.outputs.write_mode == 'verify' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json targetCommitish,isDraft,isPrerelease
          )"

          test "$(
            jq -r '.targetCommitish' <<<"${metadata}"
          )" = "${GITHUB_SHA}"

          test "$(
            jq -r '.isDraft' <<<"${metadata}"
          )" = "true"

          test "$(
            jq -r '.isPrerelease' <<<"${metadata}"
          )" = "${{ needs.validate-tag.outputs.prerelease }}"

          if latest_tag="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' \
              2>/tmp/latest-release.error
          )"; then

            test "${latest_tag}" != "${GITHUB_REF_NAME}"

          elif ! grep -Eqi \
            'HTTP 404|Not Found' \
            /tmp/latest-release.error; then

            cat /tmp/latest-release.error >&2
            exit 1
          fi

          rm -rf existing-release
          mkdir existing-release

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir existing-release

          .github/scripts/release-verify-assets.sh \
            existing-release \
            release/SHA256SUMS

      - name: Create or update GitHub Release draft
        if: ${{ needs.publication-preflight.outputs.write_mode == 'publish' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

          body: |
            2.x is a rewrite and is not compatible with 1.x data, start 2.x from an empty database and a new `encryption.key`.

            ---

            2.x 是全新重写版本，与 1.x 数据不兼容，请以全新数据库和新的 `encryption.key` 部署 2.x。

  post-publish-image-smoke:
    needs:
      - validate-tag
      - publish-images

    if: >-
      ${{
        !cancelled() &&
        needs.validate-tag.result == 'success' &&
        needs.publish-images.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR for runtime smoke
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full runtime smoke for published exact image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_SMOKE_SOURCE_IMAGE: ghcr.io/tbphp/gpt-load:${{ needs.validate-tag.outputs.image_exact }}
          RELEASE_SMOKE_SUFFIX: ${{ github.run_id }}-ghcr
          RELEASE_SMOKE_SKIP_SCAN: "true"
        run: .github/scripts/release-docker-smoke.sh

  post-publish-verify:
    needs:
      - validate-tag
      - publication-preflight
      - publish-github
      - publish-images

    if: >-
      ${{
        !cancelled() &&
        needs.validate-tag.result == 'success' &&
        needs.publication-preflight.result == 'success' &&
        needs.publish-github.result == 'success' &&
        needs.publish-images.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download complete release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Download and verify exact GitHub Release asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p draft-release

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir draft-release

          .github/scripts/release-verify-assets.sh \
            draft-release \
            release/SHA256SUMS

      - name: Verify GitHub Release channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json targetCommitish,isDraft,isPrerelease
          )"

          test "$(
            jq -r '.targetCommitish' <<<"${metadata}"
          )" = "${GITHUB_SHA}"

          test "$(
            jq -r '.isDraft' <<<"${metadata}"
          )" = "true"

          test "$(
            jq -r '.isPrerelease' <<<"${metadata}"
          )" = "${{ needs.validate-tag.outputs.prerelease }}"

          if latest_tag="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq '.tag_name' \
              2>/tmp/latest-release.error
          )"; then

            test "${latest_tag}" != "${GITHUB_REF_NAME}"

          elif ! grep -Eqi \
            'HTTP 404|Not Found' \
            /tmp/latest-release.error; then

            cat /tmp/latest-release.error >&2
            exit 1
          fi

      - name: Log in to GHCR for manifest verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published GHCR image
        shell: bash
        env:
          IMAGE_EXACT: ${{ needs.validate-tag.outputs.image_exact }}
          EXPECTED_LATEST_DIGEST: ${{ needs.publication-preflight.outputs.ghcr_latest_digest }}
        run: |
          set -euo pipefail

          exact_image="ghcr.io/tbphp/gpt-load:${IMAGE_EXACT}"

          .github/scripts/release-verify-image-revision.sh \
            "${exact_image}" \
            "${GITHUB_SHA}" \
            >/dev/null

          exact_digest="$(
            .github/scripts/release-image-digest.sh \
              "${exact_image}"
          )"

          test -n "${exact_digest}"
          test "${exact_digest}" != "absent"

          latest_digest="$(
            .github/scripts/release-image-digest.sh \
              ghcr.io/tbphp/gpt-load:latest
          )"

          # exact publication 不允许隐式修改 :latest。
          test "${latest_digest}" = "${EXPECTED_LATEST_DIGEST}"
          test "${latest_digest}" != "${exact_digest}"

          printf '%s\n' \
            "exact=${exact_digest}" \
            "latest=${latest_digest}"

  promote-image-channels:
    needs:
      - validate-tag
      - publication-preflight
      - post-publish-image-smoke
      - post-publish-verify

    if: >-
      ${{
        !cancelled() &&
        needs.validate-tag.result == 'success' &&
        needs.publication-preflight.result == 'success' &&
        needs.post-publish-image-smoke.result == 'success' &&
        needs.post-publish-verify.result == 'success'
      }}

    concurrency:
      group: gpt-load-v2-image-channels
      cancel-in-progress: false
      queue: max

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      beta_current: ${{ steps.promote.outputs.beta_current }}
      major_current: ${{ steps.promote.outputs.major_current }}

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR for channel promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified GHCR image channels
        id: promote
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}

          IMAGE_EXACT: ${{ needs.validate-tag.outputs.image_exact }}
          IMAGE_BETA: ${{ needs.validate-tag.outputs.image_beta }}
          IMAGE_MAJOR: ${{ needs.validate-tag.outputs.image_major }}

          PROMOTE_BETA: ${{ needs.validate-tag.outputs.channel_beta }}
          PROMOTE_MAJOR: ${{ needs.validate-tag.outputs.promote_major }}

          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_LATEST_DIGEST: ${{ needs.publication-preflight.outputs.ghcr_latest_digest }}
        run: |
          set -euo pipefail

          repository="ghcr.io/tbphp/gpt-load"
          exact_image="${repository}:${IMAGE_EXACT}"

          exact_digest="$(
            .github/scripts/release-image-digest.sh \
              "${exact_image}"
          )"

          test -n "${exact_digest}"
          test "${exact_digest}" != "absent"

          .github/scripts/release-verify-image-revision.sh \
            "${exact_image}" \
            "${EXPECTED_REVISION}" \
            >/dev/null

          semver_compare() {
            python3 - "$1" "$2" <<'PY'
          import re
          import sys

          def parse(value):
              value = value.strip()

              if value.startswith("v"):
                  value = value[1:]

              match = re.fullmatch(
                  r"(0|[1-9][0-9]*)\."
                  r"(0|[1-9][0-9]*)\."
                  r"(0|[1-9][0-9]*)"
                  r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?",
                  value,
              )

              if not match:
                  raise SystemExit(f"invalid SemVer: {value}")

              major = int(match.group(1))
              minor = int(match.group(2))
              patch = int(match.group(3))
              prerelease = match.group(4)

              identifiers = None
              if prerelease is not None:
                  identifiers = prerelease.split(".")

              return major, minor, patch, identifiers

          def compare_identifier(a, b):
              a_numeric = a.isdigit()
              b_numeric = b.isdigit()

              if a_numeric and b_numeric:
                  ai = int(a)
                  bi = int(b)
                  return (ai > bi) - (ai < bi)

              if a_numeric and not b_numeric:
                  return -1

              if not a_numeric and b_numeric:
                  return 1

              return (a > b) - (a < b)

          def compare(a, b):
              acore = a[:3]
              bcore = b[:3]

              if acore != bcore:
                  return (acore > bcore) - (acore < bcore)

              apre = a[3]
              bpre = b[3]

              if apre is None and bpre is None:
                  return 0

              if apre is None:
                  return 1

              if bpre is None:
                  return -1

              for left, right in zip(apre, bpre):
                  result = compare_identifier(left, right)

                  if result:
                      return result

              return (len(apre) > len(bpre)) - (len(apre) < len(bpre))

          candidate = parse(sys.argv[1])
          current = parse(sys.argv[2])

          print(compare(candidate, current))
          PY
          }

          channel_version() {
            local image="$1"
            local digest="$2"
            local version=

            if [[ "${digest}" == "absent" ]]; then
              printf '\n'
              return
            fi

            docker pull \
              --platform linux/amd64 \
              "${image}" \
              >/dev/null

            version="$(
              docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
                "${image}"
            )"

            if [[ -z "${version}" || "${version}" == "<no value>" ]]; then
              printf 'channel image has no release version label: %s\n' \
                "${image}" >&2
              exit 1
            fi

            printf '%s\n' "${version}"
          }

          promote_channel() {
            local target_tag="$1"
            local enabled="$2"
            local result_name="$3"

            local target_image=
            local target_digest=
            local current_version=
            local comparison=
            local promoted=false

            if [[ "${enabled}" != "true" ]]; then
              printf '%s=false\n' "${result_name}" >>"${GITHUB_OUTPUT}"
              return
            fi

            test -n "${target_tag}"

            target_image="${repository}:${target_tag}"

            target_digest="$(
              .github/scripts/release-image-digest.sh \
                "${target_image}"
            )"

            if [[ "${target_digest}" == "absent" ]]; then
              comparison=1
            else
              current_version="$(
                channel_version \
                  "${target_image}" \
                  "${target_digest}"
              )"

              comparison="$(
                semver_compare \
                  "${RELEASE_VERSION}" \
                  "${current_version}"
              )"
            fi

            if ((comparison < 0)); then
              printf '%s\n' \
                "channel ${target_image} already points to newer version; skipping ${RELEASE_VERSION}"

              promoted=false

            elif ((comparison == 0)); then
              if [[ "${target_digest}" != "${exact_digest}" ]]; then
                printf '%s\n' \
                  "channel ${target_image} claims ${RELEASE_VERSION} but digest differs from exact image" \
                  >&2
                exit 1
              fi

              .github/scripts/release-verify-image-revision.sh \
                "${target_image}" \
                "${EXPECTED_REVISION}" \
                >/dev/null

              promoted=true

            else
              docker buildx imagetools create \
                --tag "${target_image}" \
                "${exact_image}@${exact_digest}"

              new_digest="$(
                .github/scripts/release-image-digest.sh \
                  "${target_image}"
              )"

              test "${new_digest}" = "${exact_digest}"

              .github/scripts/release-verify-image-revision.sh \
                "${target_image}" \
                "${EXPECTED_REVISION}" \
                >/dev/null

              promoted=true
            fi

            printf '%s=%s\n' \
              "${result_name}" \
              "${promoted}" \
              >>"${GITHUB_OUTPUT}"
          }

          # publication / promotion 都不能动 :latest。
          latest_before="$(
            .github/scripts/release-image-digest.sh \
              "${repository}:latest"
          )"

          test "${latest_before}" = "${EXPECTED_LATEST_DIGEST}"

          promote_channel \
            "${IMAGE_BETA}" \
            "${PROMOTE_BETA}" \
            beta_current

          promote_channel \
            "${IMAGE_MAJOR}" \
            "${PROMOTE_MAJOR}" \
            major_current

          latest_after="$(
            .github/scripts/release-image-digest.sh \
              "${repository}:latest"
          )"

          test "${latest_after}" = "${EXPECTED_LATEST_DIGEST}"

  deploy-render:
    name: Deploy Render

    needs:
      - validate-tag
      - promote-image-channels

    if: >-
      ${{
        !cancelled() &&
        needs.validate-tag.result == 'success' &&
        needs.promote-image-channels.result == 'success' &&
        needs.promote-image-channels.outputs.major_current == 'true'
      }}

    concurrency:
      group: gpt-load-render
      cancel-in-progress: false

    environment:
      name: render
      url: ${{ vars.RENDER_SERVICE_URL }}

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}

      RELEASE_VERSION: ${{ needs.validate-tag.outputs.version }}

      IMAGE: ghcr.io/tbphp/gpt-load:${{ needs.validate-tag.outputs.image_exact }}

      RENDER_CLI_VERSION: "2.25.0"
      RENDER_CLI_SHA256: "3b3f1f839ef36b81f12d84ac7288f1c96f9f7519b39c53fe6f866612f704e7cd"

    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          [[ "${RENDER_SERVICE_ID}" =~ ^srv-[a-z0-9]+$ ]]
          [[ "${RENDER_SERVICE_URL}" =~ ^https://[^/?#]+/?$ ]]

          [[ "${RELEASE_VERSION}" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]

          [[ "${IMAGE}" == "ghcr.io/tbphp/gpt-load:${RELEASE_VERSION#v}" ]]

      - name: Install pinned Render CLI
        shell: bash
        run: |
          set -euo pipefail

          archive="cli_${RENDER_CLI_VERSION}_linux_amd64.zip"
          archive_path="${RUNNER_TEMP}/${archive}"
          extract_dir="${RUNNER_TEMP}/render-cli-${RENDER_CLI_VERSION}"

          url="https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/${archive}"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            "${url}" \
            --output "${archive_path}"

          printf '%s  %s\n' \
            "${RENDER_CLI_SHA256}" \
            "${archive_path}" |
            sha256sum --check

          mkdir -p "${extract_dir}"

          unzip \
            -q \
            "${archive_path}" \
            -d "${extract_dir}"

          install \
            -m 0755 \
            "${extract_dir}/cli_v${RENDER_CLI_VERSION}" \
            "${RUNNER_TEMP}/render"

          printf '%s\n' "${RUNNER_TEMP}" >>"${GITHUB_PATH}"

          "${RUNNER_TEMP}/render" --version

      - name: Deploy exact image and wait until live
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CI: "true"
        run: |
          set -euo pipefail

          test -n "${RENDER_API_KEY}"

          render deploys create \
            "${RENDER_SERVICE_ID}" \
            --image "${IMAGE}" \
            --wait \
            --confirm \
            --output text

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail

          health_url="${RENDER_SERVICE_URL%/}/health"

          deadline=$((SECONDS + 180))

          while true; do
            health_response=

            if health_response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 15 \
                "${health_url}"
            )" &&
              jq -e \
                --arg version "${RELEASE_VERSION}" \
                '.status == "ok" and .version == $version' \
                <<<"${health_response}" \
                >/dev/null; then

              break
            fi

            if ((SECONDS >= deadline)); then
              printf 'Render health did not report version %s within 180 seconds\n' \
                "${RELEASE_VERSION}" >&2
              exit 1
            fi

            sleep 5
          done

      - name: Summarize deployment
        shell: bash
        run: |
          {
            printf '## Render deployment\n\n'
            printf -- '- Image: `%s`\n' "${IMAGE}"
            printf -- '- Service: `%s`\n' "${RENDER_SERVICE_ID}"
            printf -- '- URL: %s\n' "${RENDER_SERVICE_URL}"
          } >>"${GITHUB_STEP_SUMMARY}"

  reconcile-publication:
    if: ${{ always() }}

    needs:
      - validate-tag
      - publication-preflight
      - publish-images
      - publish-github
      - post-publish-image-smoke
      - post-publish-verify
      - promote-image-channels

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout tag commit for read-only reconciliation
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR for read-only reconciliation
        if: ${{ always() }}
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize publication inventory and job results
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

          PREFLIGHT_RESULT: ${{ needs.publication-preflight.result }}
          IMAGE_WRITER_RESULT: ${{ needs.publish-images.result }}
          GITHUB_WRITER_RESULT: ${{ needs.publish-github.result }}
          IMAGE_SMOKE_RESULT: ${{ needs.post-publish-image-smoke.result }}
          VERIFY_POST_RESULT: ${{ needs.post-publish-verify.result }}
          PROMOTION_RESULT: ${{ needs.promote-image-channels.result }}

          IMAGE_EXACT: ${{ needs.validate-tag.outputs.image_exact }}
          IMAGE_BETA: ${{ needs.validate-tag.outputs.image_beta }}
          IMAGE_MAJOR: ${{ needs.validate-tag.outputs.image_major }}
        shell: bash
        run: |
          set +e

          github_inventory="$(
            gh release view "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json targetCommitish,isDraft,isPrerelease,assets \
              2>&1
          )"

          if [[ $? -ne 0 ]]; then
            github_inventory=absent-or-unavailable
          fi

          read_image_inventory() {
            local image="$1"
            local digest=
            local revisions=
            local status=0

            if [[ ! -x .github/scripts/release-image-digest.sh ]] ||
              [[ ! -x .github/scripts/release-verify-image-revision.sh ]]; then

              printf 'unavailable'
              return
            fi

            digest="$(
              .github/scripts/release-image-digest.sh \
                "${image}" \
                2>/dev/null
            )"

            if [[ $? -ne 0 ]]; then
              printf 'unavailable'
              return
            fi

            if [[ "${digest}" == "absent" ]]; then
              printf 'absent'
              return
            fi

            revisions="$(
              .github/scripts/release-verify-image-revision.sh \
                "${image}" \
                "${GITHUB_SHA}" \
                2>/dev/null
            )"

            status=$?

            if ((status > 1)) || [[ -z "${revisions}" ]]; then
              revisions=revision-unavailable
            fi

            printf '%s/%s' \
              "${digest}" \
              "${revisions}"
          }

          ghcr_exact_inventory="$(
            read_image_inventory \
              "ghcr.io/tbphp/gpt-load:${IMAGE_EXACT}"
          )"

          ghcr_beta_inventory=not-applicable

          if [[ -n "${IMAGE_BETA}" ]]; then
            ghcr_beta_inventory="$(
              read_image_inventory \
                "ghcr.io/tbphp/gpt-load:${IMAGE_BETA}"
            )"
          fi

          ghcr_major_inventory="$(
            read_image_inventory \
              "ghcr.io/tbphp/gpt-load:${IMAGE_MAJOR}"
          )"

          ghcr_latest_inventory="$(
            .github/scripts/release-image-digest.sh \
              ghcr.io/tbphp/gpt-load:latest \
              2>/dev/null
          )"

          if [[ $? -ne 0 ]]; then
            ghcr_latest_inventory=unavailable
          fi

          {
            printf '## Publication reconciliation\n\n'

            printf -- '- preflight: `%s`\n' \
              "${PREFLIGHT_RESULT}"

            printf -- '- GHCR image writer: `%s`\n' \
              "${IMAGE_WRITER_RESULT}"

            printf -- '- GitHub writer: `%s`\n' \
              "${GITHUB_WRITER_RESULT}"

            printf -- '- published image smoke: `%s`\n' \
              "${IMAGE_SMOKE_RESULT}"

            printf -- '- draft and image verification: `%s`\n' \
              "${VERIFY_POST_RESULT}"

            printf -- '- image channel promotion: `%s`\n' \
              "${PROMOTION_RESULT}"

            printf -- '- GitHub exact inventory: `%s`\n' \
              "${github_inventory}"

            printf -- '- GHCR exact inventory: `%s`\n' \
              "${ghcr_exact_inventory}"

            printf -- '- GHCR %s inventory: `%s`\n' \
              "${IMAGE_BETA:-beta-not-applicable}" \
              "${ghcr_beta_inventory}"

            printf -- '- GHCR %s inventory: `%s`\n' \
              "${IMAGE_MAJOR}" \
              "${ghcr_major_inventory}"

            printf -- '- GHCR latest inventory: `%s`\n' \
              "${ghcr_latest_inventory}"

            printf '\nmanual recovery: inspect exact inventories and job logs before retrying publication.\n'
          } >>"${GITHUB_STEP_SUMMARY}"
